<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="center">
<main class="box">
    <h2>I-ITSM login</h2>
    <p class="msg err" th:if="${param.error}">Invalid email or password</p>
    <p class="msg ok" th:if="${param.logout}">You have been logged out</p>
    <p class="msg ok" th:if="${ok}" th:text="${ok}"></p>
    <form method="post" th:action="@{/login}">
        <label>Email <input name="username" type="email" required autofocus></label>
        <label>Password <input name="password" type="password" required></label>
        <button type="submit">Log in</button>
    </form>
    <p>New employee? <a th:href="@{/register}">Register</a></p>
</main>
</body>
</html>
